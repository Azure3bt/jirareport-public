services:
  postgres:
    image: postgres:15-alpine
    container_name: jirareporter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jiradb
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jira-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira -d jiradb"]
      interval: 10s
      timeout: 5s
      retries: 10

  jira:
    image: atlassian/jira-software:latest
    container_name: jirareporter-jira
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/jiradb
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jira_local_password
      ATL_DB_TYPE: postgres72
      JVM_MINIMUM_MEMORY: 1g
      JVM_MAXIMUM_MEMORY: 2g
    volumes:
      - jira_data:/var/atlassian/application-data/jira
    networks:
      - jira-net

volumes:
  jira_data:
  postgres_data:

networks:
  jira-net:
    driver: bridge
